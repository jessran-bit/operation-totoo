<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head><body>
<title>Totoo Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: instructor console. Gate, then three tabs: Collect codes, Score the Boss, Reveal. Same dark look as the game. */
:root{
  --bg:#0a1424; --panel:#101e33; --panel2:#15263e; --line:#223858; --fg:#e8eef7; --muted:#93a4bd;
  --teal:#19b3a3; --orange:#f39a2b; --red:#ef4a5a; --green:#22c08a; --violet:#7b5cff; --blue:#3b82f6;
  --display:"Archivo","Arial Black",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -120px,#12304a 0%,transparent 60%),var(--bg);color:var(--fg);font:16px/1.55 var(--body);min-height:100%}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.pill{display:inline-block;border:1px solid #1d5a58;background:#0d2a30;color:var(--teal);font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
.hero{text-align:center;display:grid;gap:10px;justify-items:center}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:.02em;line-height:1}
.hero h1 span{color:var(--teal)}
.sub{color:var(--orange);font:600 14px/1 var(--display);letter-spacing:.3em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.label{font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--red);font-weight:700;font-size:14px}
.ok{color:var(--green)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--teal);color:#08121f}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.orange{background:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=password],textarea{width:100%;background:#0b172a;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:150px;font:500 12px/1.45 var(--mono)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--teal);color:#08121f;border-color:var(--teal)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:720px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font:700 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right}
.tbadge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font:900 15px/1 var(--display);color:#08121f;background:var(--tc);margin-right:8px;vertical-align:middle}
.flag{color:var(--red);font-weight:700;font-size:12px}
.bossgrid{display:grid;gap:14px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.para{background:#0b172a;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px;max-height:260px;overflow:auto}
.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sl{display:grid;gap:4px}
.sl input{width:100%;accent-color:var(--orange)}
.sl b{font:800 18px/1 var(--display);color:var(--orange)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stage{display:grid;gap:10px}
.rank{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:16px 18px;animation:rise .5s ease both}
.rank .pos{font:900 34px/1 var(--display);color:var(--muted)}
.rank .nm{font:800 22px/1.1 var(--display)}
.rank .pts{font:900 34px/1 var(--display);color:var(--orange);font-variant-numeric:tabular-nums}
.rank.win{border-color:var(--orange);background:#2a1d0c}
.rank.win .pos{color:var(--orange)}
.crown{font:700 12px/1 var(--mono);letter-spacing:.2em;color:var(--orange)}
@keyframes rise{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
.key{display:grid;gap:8px}
.krow{display:grid;grid-template-columns:60px 110px 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.krow b.Real{color:var(--green)} .krow b.Twisted{color:var(--orange)} .krow b.Fake{color:var(--red)}
.cardgrid{overflow-x:auto}
.cardgrid td,.cardgrid th{text-align:center;padding:6px}
@media (max-width:720px){.sliders,.two{grid-template-columns:1fr}.krow{grid-template-columns:1fr}.rank{grid-template-columns:50px 1fr auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<main class="wrap" id="app"></main>
<script src="engine.js" charset="utf-8"></script>
<script>
(function(){
var P=TOTOO.PUB, $app=document.getElementById("app");
var COLORS={A:"var(--teal)",B:"var(--violet)",C:"var(--orange)",D:"var(--red)",E:"var(--green)",F:"var(--blue)"};
var store={codes:"",boss:{}}, tab="collect", revealN=0;
try{var s=JSON.parse(localStorage.getItem("totoo_mc"));if(s)store=s;}catch(e){}
function save(){try{localStorage.setItem("totoo_mc",JSON.stringify(store));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function team(id){return P.teams.filter(function(t){return t.id===id;})[0];}

function parse(){
  var found={}, errors=[];
  (store.codes.match(/TOTOO1\.[A-Za-z0-9+\/=\s]+?\.[a-z0-9]+(?=\s|$)/g)||[]).forEach(function(c){
    var d=TOTOO.decode(c); if(d.error){errors.push(d.error);return;}
    var r=d.run, prev=found[r.team];
    if(!prev||r.attempt<prev.run.attempt||(r.attempt===prev.run.attempt&&r.finish<prev.run.finish)) found[r.team]={run:r,dupes:prev?(prev.dupes||0)+1:0};
    else prev.dupes=(prev.dupes||0)+1;
  });
  return {teams:found, errors:errors};
}
function rows(){
  var p=parse(), out=[];
  Object.keys(p.teams).forEach(function(id){var r=p.teams[id].run, s=TOTOO.score(r), b=store.boss[id]||{fit:0,stmt:0,rq:0}, bs=(+b.fit||0)+(+b.stmt||0)+(+b.rq||0);
    out.push({id:id,run:r,s:s,boss:bs,scored:!!store.boss[id],total:s.auto+bs,dupes:p.teams[id].dupes});});
  out.sort(function(a,b){return b.total-a.total||b.boss-a.boss||String(a.run.finish).localeCompare(String(b.run.finish));});
  return {rows:out,errors:p.errors};
}

function gate(){
  $app.innerHTML='<div class="hero"><span class="pill">Instructor only</span><h1>MISSION <span>CONTROL</span></h1><p class="sub">Operation Totoo</p></div>'+
   '<section class="panel" style="max-width:420px;margin:0 auto;width:100%"><label for="pw" class="label">Password</label><input type="password" id="pw" autocomplete="off"><p class="err" id="pe" hidden>Wrong password.</p><button class="btn" id="go">Enter</button></section>';
  var go=function(){if(TOTOO.checkAdmin(document.getElementById("pw").value)){try{sessionStorage.setItem("totoo_ok","1");}catch(e){} main();}else document.getElementById("pe").hidden=false;};
  document.getElementById("go").onclick=go; document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")go();};
}

function main(){
  var R=rows();
  var tabs=[["collect","1 · Collect codes"],["boss","2 · Score the Boss"],["reveal","3 · Reveal"],["key","Answer key"]];
  var html='<div class="hero"><span class="pill">Instructor only</span><h1>MISSION <span>CONTROL</span></h1><p class="sub">Operation Totoo</p></div>'+
    '<div class="tabs">'+tabs.map(function(t){return '<button class="tab'+(tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  if(tab==="collect") html+=collect(R);
  if(tab==="boss") html+=bossTab(R);
  if(tab==="reveal") html+=revealTab(R);
  if(tab==="key") html+=keyTab();
  $app.innerHTML=html;
  $app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;revealN=0;main();};});
  bind(R);
}

function collect(R){
  var t='<section class="panel"><span class="label">Paste mission codes</span><p>Paste every team\'s mission code here, in any order. The scores are checked against the answer key, so a team cannot change its own score.</p>'+
    '<textarea id="codes" placeholder="TOTOO1.....">'+esc(store.codes)+'</textarea><div class="row"><button class="btn" id="chk">Check codes</button><button class="btn ghost" id="clr">Clear everything</button><span class="hint" id="clrq" hidden>Click Clear everything again to confirm.</span></div>'+
    (R.errors.length?'<p class="err">'+R.errors.length+' code(s) rejected: '+esc(R.errors.join(" "))+'</p>':'')+'</section>';
  t+='<section class="panel"><span class="label">Verified teams ('+R.rows.length+' of 6)</span>'+(R.rows.length?'<div class="tblwrap"><table><thead><tr><th>Team</th><th>Attempt</th><th>Finished</th><th class="n">Cards</th><th class="n">L1</th><th class="n">L2</th><th class="n">L3</th><th class="n">Lives</th><th class="n">Time</th><th class="n">Auto /70</th><th class="n">Boss /30</th></tr></thead><tbody>'+
    R.rows.map(function(r){var tm=team(r.id);return '<tr><td style="--tc:'+COLORS[r.id]+'"><span class="tbadge">'+r.id+'</span>'+esc(tm.name)+(r.dupes?' <span class="flag">'+(r.dupes+1)+' codes sent</span>':'')+'</td><td>'+(r.run.attempt>1?'<span class="flag">#'+r.run.attempt+'</span>':'#1')+'</td><td>'+esc(String(r.run.finish||"").slice(11,16))+' UTC</td><td class="n">'+r.s.correct+'/'+P.cards.length+'</td><td class="n">'+r.s.l1+'</td><td class="n">'+r.s.l2+'</td><td class="n">'+r.s.l3+'</td><td class="n">'+r.s.livesBonus+'</td><td class="n">'+r.s.timeBonus+(r.run.timedOut?' <span class="flag">ran out</span>':'')+'</td><td class="n"><b>'+r.s.auto+'</b></td><td class="n">'+(r.scored?r.boss:'<span class="hint">not yet</span>')+'</td></tr>';}).join("")+
    '</tbody></table></div><p class="hint">If a team sent more than one code, the lowest attempt number counts. An attempt above #1 means the team restarted on that device.</p>':'<p class="hint">No codes yet.</p>')+'</section>';
  if(R.rows.length) t+='<section class="panel"><span class="label">Card by card</span><div class="cardgrid tblwrap"><table><thead><tr><th>Team</th>'+P.cards.map(function(c){return '<th>'+c.id+'</th>';}).join("")+'</tr></thead><tbody>'+
    R.rows.map(function(r){return '<tr><td>'+r.id+'</td>'+P.cards.map(function(c){var v=r.s.cards[c.id];return '<td>'+(v==="right"?'<span class="ok">✓</span>':v==="wrong"?'<span class="flag">✗</span>':v==="timeout"?'<span class="hint">·</span>':'')+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div><p class="hint">Use this in the debrief: which fake fooled the most teams?</p></section>';
  return t;
}

function bossTab(R){
  if(!R.rows.length) return '<section class="panel"><p class="hint">Paste mission codes first.</p></section>';
  return '<section class="panel"><span class="label">Boss Level rubric</span><p>Read each gap statement and set three scores. Gap fits the map (0 to 10), statement quality (0 to 15), research question traces to the cards (0 to 5). Scores save as you go.</p></section><div class="bossgrid">'+
   R.rows.map(function(r){var b=r.run.boss||{}, sc=store.boss[r.id]||{fit:0,stmt:0,rq:0}, tm=team(r.id);
     return '<article class="bcard" style="--tc:'+COLORS[r.id]+'"><h3><span class="tbadge">'+r.id+'</span>'+esc(tm.name)+'</h3>'+
      '<p><b>Gap type:</b> '+esc(b.gap)+'</p><p><b>Research question:</b> '+esc(b.rq)+'</p>'+
      '<div><span class="label">Gap statement</span><div class="para">'+esc(b.stmt||"(not submitted: time ran out)")+'</div></div>'+
      '<p class="hint"><b>Their map:</b> '+(r.run.l3?r.run.l3.themes.map(function(nm,k){return nm?esc(nm)+': '+Object.keys(r.run.l3.assign).filter(function(c){return r.run.l3.assign[c]===k;}).join(", "):"";}).filter(Boolean).join(" · "):"none")+'</p>'+
      '<div class="sliders">'+[["fit","Gap fits the map",10],["stmt","Statement quality",15],["rq","RQ traces to cards",5]].map(function(x){return '<div class="sl"><label for="'+r.id+x[0]+'">'+x[1]+' <b id="v'+r.id+x[0]+'">'+(sc[x[0]]||0)+'</b> / '+x[2]+'</label><input type="range" min="0" max="'+x[2]+'" value="'+(sc[x[0]]||0)+'" id="'+r.id+x[0]+'" data-t="'+r.id+'" data-k="'+x[0]+'"></div>';}).join("")+'</div></article>';}).join("")+'</div>';
}

function revealTab(R){
  if(!R.rows.length) return '<section class="panel"><p class="hint">Paste mission codes first.</p></section>';
  var missing=R.rows.filter(function(r){return !r.scored;}).length;
  var asc=R.rows.slice().reverse(), shown=asc.slice(0,revealN).reverse();
  var t='<section class="panel"><p>Put this on the projector. Click <b>Reveal next</b> to show teams from last place to first.</p>'+(missing?'<p class="err">'+missing+' team(s) have no Boss score yet.</p>':'')+
    '<div class="row"><button class="btn orange" id="nx"'+(revealN>=asc.length?" disabled":"")+'>'+(revealN===asc.length-1?"Reveal the winner":"Reveal next")+'</button><button class="btn ghost" id="rs">Start over</button></div></section><div class="stage">';
  shown.forEach(function(r){var pos=R.rows.indexOf(r)+1, win=pos===1&&revealN>=asc.length, tm=team(r.id);
    t+='<div class="rank'+(win?" win":"")+'" style="--tc:'+COLORS[r.id]+'"><span class="pos">#'+pos+'</span><div>'+(win?'<div class="crown">QUIZ EXEMPTION</div>':'')+'<div class="nm"><span class="tbadge">'+r.id+'</span>'+esc(tm.name)+'</div><div class="hint">Auto '+r.s.auto+' + Boss '+r.boss+'</div></div><span class="pts">'+r.total+'</span></div>';});
  return t+'</div>';
}

function keyTab(){
  return '<section class="panel"><span class="label">Evidence cards</span><div class="key">'+P.cards.map(function(c){var a=TOTOO.truth(c.id);return '<div class="krow"><b>'+c.id+'</b><b class="'+a+'">'+a.toUpperCase()+'</b><span>'+esc(TOTOO.clue(c.id))+'</span></div>';}).join("")+'</div></section>'+
   '<section class="panel"><span class="label">Prompt Lab best answers</span><div class="key">'+P.tasks.map(function(t){var b=TOTOO.best(t.id), o=t.options.filter(function(x){return x.id===b;})[0];return '<div class="krow" style="grid-template-columns:60px 1fr"><b>'+esc(t.title)+'</b><span>'+esc(o.text)+'<br><span class="hint">'+esc(TOTOO.why(t.id))+'</span></span></div>';}).join("")+'</div></section>';
}

function bind(R){
  var el;
  if((el=document.getElementById("chk"))) el.onclick=function(){store.codes=document.getElementById("codes").value;save();main();};
  if((el=document.getElementById("clr"))){var armed=false; el.onclick=function(){if(!armed){armed=true;document.getElementById("clrq").hidden=false;return;} store={codes:"",boss:{}};save();main();};}
  $app.querySelectorAll("input[type=range]").forEach(function(s){s.oninput=function(){var id=s.dataset.t,k=s.dataset.k;store.boss[id]=store.boss[id]||{fit:0,stmt:0,rq:0};store.boss[id][k]=+s.value;document.getElementById("v"+id+k).textContent=s.value;save();};});
  if((el=document.getElementById("nx"))) el.onclick=function(){revealN++;main();};
  if((el=document.getElementById("rs"))) el.onclick=function(){revealN=0;main();};
}

var ok=false; try{ok=sessionStorage.getItem("totoo_ok")==="1";}catch(e){}
ok?main():gate();
})();
</script>
</body></html>
