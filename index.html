<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head><body>
<title>Operation Totoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centered mission column; a sticky HUD appears once a team is playing. Single dark look to match Operation Bagyo. */
:root{
  --bg:#0a1424; --panel:#101e33; --panel2:#15263e; --line:#223858; --fg:#e8eef7; --muted:#93a4bd;
  --teal:#19b3a3; --orange:#f39a2b; --red:#ef4a5a; --green:#22c08a; --violet:#7b5cff; --blue:#3b82f6;
  --display:"Archivo","Arial Black",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -120px,#12304a 0%,transparent 60%),var(--bg);color:var(--fg);font:16px/1.55 var(--body);min-height:100%}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.pill{display:inline-block;border:1px solid #1d5a58;background:#0d2a30;color:var(--teal);font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
.hero{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:12px 26px}
.hero h1{font-size:clamp(40px,8vw,72px);font-weight:900;letter-spacing:.02em;line-height:1}
.hero h1 span{color:var(--teal)}
.sub{color:var(--orange);font:600 clamp(13px,2.2vw,17px)/1 var(--display);letter-spacing:.32em;text-transform:uppercase}
.lead{color:var(--muted);max-width:600px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.label{font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 12px;text-align:center;display:grid;gap:6px}
.step b{font:900 24px/1 var(--display);color:var(--teal)}
.step span{color:var(--muted);font-size:14px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.team{background:var(--panel2);border:2px solid var(--tc);border-radius:12px;padding:18px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:transform .15s,background .15s}
.team:hover{transform:translateY(-2px);background:#1a2e4a}
.team .big{font:900 40px/1 var(--display);color:var(--tc)}
.team .k{font:700 11px/1 var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.team .n{font-weight:700;font-size:17px}
.team .m{color:var(--muted);font-size:13px}
.team .done{font:700 11px/1 var(--mono);color:var(--green);letter-spacing:.1em}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,20,36,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hud .tm{display:flex;gap:10px;align-items:center;font-weight:700}
.hud .badge{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:900 18px/1 var(--display);background:var(--tc);color:#08121f}
.hud .grow{flex:1}
.hearts{font-size:18px;letter-spacing:2px;color:var(--red)}
.hearts .off{color:#3a4a63}
.scorebox{font:700 15px/1 var(--mono);background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-variant-numeric:tabular-nums}
.scorebox b{color:var(--orange)}
.clock{font:700 15px/1 var(--mono);padding:8px 12px;border-radius:8px;background:#2a1d0c;border:1px solid #6b4a1d;color:var(--orange);font-variant-numeric:tabular-nums}
.clock.low{background:#2c1420;border-color:var(--red);color:#ffb3bc}
.lvls{display:flex;gap:6px}
.lvls i{font:700 11px/1 var(--mono);font-style:normal;padding:6px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.lvls i.on{background:var(--teal);color:#08121f;border-color:var(--teal)}
.lvls i.ok{color:var(--green);border-color:#1f5e4a}
/* buttons and inputs */
.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--teal);color:#08121f}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.orange{background:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],textarea,select{width:100%;background:#0b172a;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
::placeholder{color:#5d6f8a;font-style:italic}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--red);font-size:14px;font-weight:700}
.ok{color:var(--green)}
/* evidence card */
.deck{display:flex;gap:4px;flex-wrap:wrap}
.deck i{width:18px;height:6px;border-radius:3px;background:#24395a}
.deck i.r{background:var(--green)} .deck i.w{background:var(--red)} .deck i.t{background:#64748b} .deck i.c{background:var(--orange)}
.closed{border:2px dashed #2f4a70;border-radius:14px;padding:46px 20px;text-align:center;cursor:pointer;background:repeating-linear-gradient(45deg,#0f1d31,#0f1d31 12px,#122239 12px,#122239 24px);display:grid;gap:8px}
.closed b{font:900 28px/1 var(--display);letter-spacing:.06em}
.ev{background:#f4efe3;color:#1b2333;border-radius:12px;padding:20px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ev .tag{font:700 11px/1 var(--mono);letter-spacing:.2em;color:#7a5b2e}
.ev .cite{font-size:15px}
.ev .claim{border-left:4px solid var(--orange);padding-left:12px;font-weight:500}
.ev a{color:#0f6c63;font-weight:700}
.timer{height:8px;background:#22324d;border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--orange);transition:width 1s linear}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.v{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px 10px;cursor:pointer;display:grid;gap:4px;text-align:center}
.v b{font:900 18px/1 var(--display)}
.v span{color:var(--muted);font-size:12px}
.v.real b{color:var(--green)} .v.tw b{color:var(--orange)} .v.fake b{color:var(--red)}
.result{border-radius:12px;padding:16px;display:grid;gap:6px;border:2px solid}
.result.good{border-color:var(--green);background:#0e2a25}
.result.bad{border-color:var(--red);background:#2c1420}
.result h3{font-size:20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left}
.opt.sel{border-color:var(--teal)}
.opt.best{border-color:var(--green)} .opt.miss{border-color:var(--red)}
.opt .l{font:900 16px/1 var(--display);color:var(--teal);min-width:20px}
.code{font:500 12px/1.45 var(--mono);word-break:break-all;background:#071020;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:140px;overflow:auto}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.map .col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.map .col h3{font-size:15px;color:var(--teal)}
.chip{font-size:13px;padding:6px 8px;border-radius:6px;background:#0b172a;border:1px solid var(--line)}
.chip.badc{border-color:var(--red);color:#ffb3bc}
.assign{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.arow .t{font-size:14px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:720px){.seg{grid-template-columns:1fr 1fr}}
.sb{flex:1 1 auto;border:1px solid var(--line);background:#0b172a;border-radius:8px;padding:9px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--fg)}
.sb.on{background:var(--teal);border-color:var(--teal);color:#08121f}
.sb.out.on{background:#2a3a55;border-color:#3b5275;color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:720px){.seg{grid-template-columns:1fr 1fr}}
.sb{flex:1 1 auto;border:1px solid var(--line);background:#0b172a;border-radius:8px;padding:9px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--fg);text-align:center}
.sb[disabled]{opacity:.35;cursor:not-allowed}
.sb.on{background:var(--teal);border-color:var(--teal);color:#08121f}
.sb.out.on{background:#2a3a55;border-color:#3b5275;color:var(--fg)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tchip{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;text-align:left;color:var(--fg)}
.tchip.on{border-color:var(--teal);background:#0d2a30;color:var(--teal)}
.vtag{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--green);border:1px solid #1f5e4a;border-radius:4px;padding:3px 5px;margin-left:4px}
.evi{font-size:13px;padding:8px;border-radius:6px;background:#0b172a;border:1px solid var(--line)}
.bigscore{font:900 clamp(56px,12vw,96px)/1 var(--display);color:var(--orange);font-variant-numeric:tabular-nums}
.break{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.break div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;display:grid;gap:4px}
.break b{font:800 22px/1 var(--display)}
.break span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal);color:#08121f;font-weight:700;padding:10px 16px;border-radius:999px;z-index:20}
.center{text-align:center;justify-items:center}
@media (max-width:720px){.steps{grid-template-columns:repeat(2,1fr)}.teams{grid-template-columns:repeat(2,1fr)}.break{grid-template-columns:repeat(2,1fr)}.arow{grid-template-columns:1fr}.verdicts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="hud" class="hud" hidden></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="engine.js" charset="utf-8"></script>
<script>
(function(){
var P = TOTOO.PUB, $app = document.getElementById("app"), $hud = document.getElementById("hud");
var COLORS = {A:"var(--teal)",B:"var(--violet)",C:"var(--orange)",D:"var(--red)",E:"var(--green)",F:"var(--blue)"};
var CARD_TIME = 90, GAME_MS = TOTOO.GAME_MS;
var state = null, timerId = null, clockId = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function team(id){return P.teams.filter(function(t){return t.id===id;})[0];}
function card(id){return P.cards.concat(P.extras).filter(function(c){return c.id===id;})[0];}
function shortRef(c){return c.cite.split(" (")[0].split(",")[0]+(c.cite.split(" (")[0].indexOf("&")>=0||c.cite.split(",").length>3?" et al.":"")+" ("+((c.cite.match(/\((\d{4})\)/)||[,""])[1])+")";}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function save(){if(state) lsSet("totoo_run_"+state.team, state);}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true;},1800);}
function copy(text){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied");},function(){toast("Select the text and copy it");});} else toast("Select the text and copy it"); }
function now(){return new Date().toISOString();}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function msLeft(){return state&&state.clockStart?Math.max(0,GAME_MS-(Date.now()-state.clockStart)):GAME_MS;}
function fmt(ms){var s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2);}

/* ---------------- mission clock ---------------- */
function startClock(){
  if(clockId) clearInterval(clockId);
  clockId=setInterval(function(){
    if(!state||state.finish||!state.clockStart){clearInterval(clockId);clockId=null;return;}
    var left=msLeft(), el=document.getElementById("clock");
    if(el){el.textContent=fmt(left);el.classList.toggle("low",left<3*60000);}
    if(left<=0) timeUp();
  },1000);
}
function timeUp(){
  stopTimer(); if(clockId){clearInterval(clockId);clockId=null;}
  if(state.l1open){state.l1.push({c:state.l1open.c,v:null});state.l1open=null;}
  state.timeLeft=0; state.finish=now(); state.timedOut=true; state.level=5; save(); report(false,true);
}

/* ---------------- HUD ---------------- */
function hud(){
  if(!state){$hud.hidden=true;return;}
  var t=team(state.team), s=TOTOO.score(state), lvl=state.level;
  var hearts=""; for(var i=0;i<3;i++) hearts+= i<s.lives?"♥":'<span class="off">♥</span>';
  var names=["L1 Cards","L2 Prompts","L3 Map","Boss"];
  var clock=state.clockStart&&!state.finish?'<div class="clock" id="clock" title="Mission clock">'+fmt(msLeft())+'</div>':(state.finish?'<div class="clock">DONE</div>':'<div class="clock">20:00</div>');
  $hud.innerHTML='<div class="in" style="--tc:'+COLORS[t.id]+'"><div class="tm"><div class="badge">'+t.id+'</div><div>'+esc(t.name)+'<div class="hint">Mission '+t.mission+'</div></div></div>'+
    '<div class="lvls">'+names.map(function(n,i){var c=i+1<lvl?"ok":(i+1===lvl?"on":"");return '<i class="'+c+'">'+n+'</i>';}).join("")+'</div>'+
    '<div class="grow"></div><div class="hearts" aria-label="'+s.lives+' lives left">'+hearts+'</div>'+clock+'<div class="scorebox">SCORE <b>'+(state.finish?s.auto:s.l1+s.l2+s.l3)+'</b></div></div>';
  $hud.hidden=false;
}

/* ---------------- HOME ---------------- */
function home(){
  stopTimer(); if(clockId){clearInterval(clockId);clockId=null;} state=null; hud();
  var tiles=P.teams.map(function(t){var r=lsGet("totoo_run_"+t.id), done=r&&r.finish?'<span class="done">MISSION COMPLETE</span>':(r?'<span class="done" style="color:var(--orange)">IN PROGRESS</span>':"");
    return '<button class="team" style="--tc:'+COLORS[t.id]+'" data-team="'+t.id+'"><span class="big">'+t.id+'</span><span class="k">Team '+t.id+'</span><span class="n">'+esc(t.name)+'</span><span class="m">Mission '+t.mission+'</span>'+done+'</button>';}).join("");
  $app.innerHTML='<section class="hero"><span class="pill">DLSU RESBUSM · Class Game</span><h1>OPERATION <span>TOTOO</span></h1><p class="sub">Research Intel Command</p>'+
    '<p class="lead">A chatbot handed your team sources on gender bias in AI. Some are real. Some are fake. Some lie about what the paper found. You have 20 minutes to find the truth, pick the right prompts, build your map, and crack the research gap.</p></section>'+
    '<div class="stack"><section class="panel"><span class="label">How it works</span><div class="steps">'+
    '<div class="step"><b>01</b><span>Pick your team below and open it on one device</span></div>'+
    '<div class="step"><b>02</b><span>Enter the team code your instructor gave you</span></div>'+
    '<div class="step"><b>03</b><span>Clear 4 levels in 20 minutes. Your score is calculated automatically</span></div>'+
    '<div class="step"><b>04</b><span>Send your mission code. Mission Control reveals the winner</span></div></div></section>'+
    '<section class="panel"><span class="label">Select your team</span><div class="teams">'+tiles+'</div></section>'+
    '<p class="hint" style="text-align:center">Highest final score wins. Only your team\'s first run counts.</p></div>';
  $app.querySelectorAll("[data-team]").forEach(function(b){b.onclick=function(){login(b.dataset.team);};});
}

/* ---------------- LOGIN ---------------- */
function login(id){
  var t=team(id), saved=lsGet("totoo_run_"+id);
  $app.innerHTML='<section class="panel center" style="max-width:460px;margin:40px auto;--tc:'+COLORS[id]+'"><span class="team" style="--tc:'+COLORS[id]+';cursor:default;width:100%"><span class="big">'+id+'</span><span class="n">'+esc(t.name)+'</span><span class="m">Mission '+t.mission+'</span></span>'+
    '<div class="field" style="width:100%"><label for="pin">Team code</label><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="4-digit code from your instructor"></div>'+
    '<p class="err" id="perr" hidden>That code is not right for Team '+id+'. Check the slip from your instructor.</p>'+
    '<div class="row"><button class="btn ghost" id="back">Back</button><button class="btn" id="go">'+(saved?(saved.finish?"View report":"Resume mission"):"Start mission")+'</button></div></section>';
  document.getElementById("back").onclick=home;
  var go=function(){
    if(!TOTOO.checkPin(id,document.getElementById("pin").value)){document.getElementById("perr").hidden=false;return;}
    if(saved){state=saved;}
    else{var att=(lsGet("totoo_att_"+id)||0)+1; lsSet("totoo_att_"+id,att);
      state={team:id,attempt:att,start:now(),level:0,order:TOTOO.seededOrder(P.cards.map(function(c){return c.id;}),"order"+id),l1:[],l2:[],l2step:{},l3:null,boss:null}; save();}
    route();
  };
  document.getElementById("go").onclick=go;
  document.getElementById("pin").onkeydown=function(e){if(e.key==="Enter")go();};
  document.getElementById("pin").focus();
}

function route(){
  if(state.clockStart&&!state.finish&&msLeft()<=0) return timeUp();
  hud(); window.scrollTo(0,0); if(state.clockStart&&!state.finish) startClock();
  if(state.finish) return report();
  if(state.level===0) return briefing();
  if(state.level===1) return level1();
  if(state.level===2) return level2();
  if(state.level===3) return level3();
  if(state.level===4) return boss();
}

/* ---------------- BRIEFING ---------------- */
function briefing(){
  var t=team(state.team);
  $app.innerHTML='<section class="stack"><div class="hero" style="padding-block:6px"><span class="pill">Mission '+t.mission+' · Briefing</span><h1 style="font-size:clamp(30px,6vw,48px)">Your mission, '+esc(t.name)+'</h1></div>'+
   '<section class="panel"><span class="label">Rules of engagement</span>'+
   '<p><b>20 minutes.</b> The mission clock starts when you press Start. When it hits 0:00, the game ends and saves what you have done.</p>'+
   '<p><b>3 lives.</b> You lose a life each time you trust a fake or twisted source by calling it Real.</p>'+
   '<p><b>4 levels.</b> Card Drop (6 cards, 90 seconds each), Prompt Lab (3 tricky prompt choices), Map Builder (choose 3 themes and place up to 10 studies), and the Boss Level. They unlock in order.</p>'+
   '<p><b>Scoring.</b> Up to 70 points are calculated here, including a bonus for lives left and for finishing early. Mission Control scores your Boss Level gap statement (up to 30 points). Highest total wins.</p>'+
   '<p><b>Tools.</b> Use Google Scholar and DOI links. A chatbot saying a paper is real is not proof. Only the paper is proof.</p>'+
   '<p class="hint">Split the work: one person searches, one reads the summary, one decides. If the page reloads, your progress and clock are saved on this device.</p></section>'+
   '<div class="row" style="justify-content:center"><button class="btn orange" id="start">Start the clock: Level 1</button></div></section>';
  document.getElementById("start").onclick=function(){state.level=1;state.clockStart=Date.now();save();route();};
}

/* ---------------- LEVEL 1 ---------------- */
function level1(){
  stopTimer();
  var idx=state.l1.length, n=state.order.length;
  if(idx>=n) return l1Done();
  var cid=state.order[idx], c=card(cid);
  var deck=state.order.map(function(id,i){var a=state.l1[i]; if(!a) return i===idx?'<i class="c"></i>':'<i></i>'; var s=TOTOO.score({l1:[a]}).cards[a.c]; return '<i class="'+(s==="right"?"r":s==="timeout"?"t":"w")+'"></i>';}).join("");
  var head='<section class="stack"><div class="row" style="justify-content:space-between"><h2>Level 1: Card Drop</h2><span class="label">Card '+(idx+1)+' of '+n+'</span></div><div class="deck">'+deck+'</div>';
  if(!state.l1open){
    $app.innerHTML=head+'<button class="closed" id="open"><span class="label">Evidence file</span><b>TAP TO OPEN</b><span class="hint">You get '+CARD_TIME+' seconds once it opens. 5 points for each correct call.</span></button></section>';
    document.getElementById("open").onclick=function(){state.l1open={c:cid,at:Date.now()};save();level1();};
    return;
  }
  var q=encodeURIComponent(c.cite.replace(/^.*?\(\d{4}\)\.\s*/,"").split(/\.\s/)[0]);
  $app.innerHTML=head+'<article class="ev"><span class="tag">EVIDENCE '+c.id+'</span><p class="cite">'+esc(c.cite)+'</p><p class="claim"><b>What the chatbot said:</b> '+esc(c.claim)+'</p>'+
    '<p><a href="https://scholar.google.com/scholar?q='+q+'" target="_blank" rel="noopener">Search this title in Google Scholar ↗</a></p></article>'+
    '<div class="timer"><i id="bar" style="width:100%"></i></div><p class="hint" id="secs"></p>'+
    '<div class="verdicts"><button class="v real" data-v="Real"><b>REAL</b><span>Exists, summary correct</span></button><button class="v tw" data-v="Twisted"><b>TWISTED</b><span>Exists, summary wrong</span></button><button class="v fake" data-v="Fake"><b>FAKE</b><span>Does not exist</span></button></div></section>';
  $app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){answer(b.dataset.v);};});
  function tick(){var left=CARD_TIME-Math.floor((Date.now()-state.l1open.at)/1000);
    if(left<=0){answer(null);return;}
    document.getElementById("bar").style.width=(left/CARD_TIME*100)+"%"; document.getElementById("secs").textContent=left+" seconds left on this card";}
  tick(); timerId=setInterval(tick,1000);
  function answer(v){
    stopTimer(); var before=TOTOO.score(state);
    state.l1.push({c:cid,v:v}); state.l1open=null; save();
    var after=TOTOO.score(state), right=after.cards[cid]==="right", gained=after.l1-before.l1, lost=before.lives-after.lives;
    hud();
    var title=v===null?"Time is up for this card":(right?"Correct":"Not quite"), truth=TOTOO.truth(cid);
    $app.innerHTML=head.replace('<i class="c"></i>','<i class="'+(right?"r":v?"w":"t")+'"></i>')+
      '<div class="result '+(right?"good":"bad")+'"><h3>'+title+(gained?' · +'+gained+' points':'')+(lost?' · you lost a life':'')+'</h3>'+
      '<p><b>'+c.id+' is '+truth.toUpperCase()+'.</b> '+esc(TOTOO.clue(cid))+'</p></div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" id="next">'+(state.l1.length>=n?"Finish Level 1":"Next card")+'</button></div></section>';
    document.getElementById("next").onclick=level1;
  }
}
function l1Done(){
  var s=TOTOO.score(state);
  $app.innerHTML='<section class="panel center"><span class="label">Level 1 cleared</span><h2>'+s.correct+' of '+state.order.length+' correct</h2><p class="lead">Level 1 points: <b>'+s.l1+'</b>. Lives left: '+s.lives+'.</p>'+
   '<p class="hint">Next: how you ask changes what the AI gives you.</p><button class="btn orange" id="n">Start Level 2: Prompt Lab</button></section>';
  document.getElementById("n").onclick=function(){state.level=2;save();route();};
}

/* ---------------- LEVEL 2 ---------------- */
function level2(){
  var i=state.l2.length;
  if(i>=P.tasks.length) return l2Done();
  var t=P.tasks[i], st=state.l2step[t.id]||{};
  var opts=TOTOO.seededOrder(t.options,"opt"+state.team+t.id);
  var head='<section class="stack"><div class="row" style="justify-content:space-between"><h2>Level 2: Prompt Lab</h2><span class="label">Task '+(i+1)+' of '+P.tasks.length+'</span></div>'+
    '<section class="panel"><span class="label">Task: '+esc(t.title)+'</span><p>'+esc(t.task)+'</p></section>';
  if(!st.pick){
    $app.innerHTML=head+'<p><b>Which prompt should you use?</b> Read all four carefully. Some sound smart but have a flaw. Best prompt = 5 points, close = 2, trap = 0.</p><div class="opts">'+opts.map(function(o,k){return '<button class="opt" data-o="'+o.id+'"><span class="l">'+"ABCD"[k]+'</span><span>'+esc(o.text)+'</span></button>';}).join("")+'</div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" id="lock" disabled>Lock in</button></div></section>';
    var chosen=null;
    $app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){chosen=b.dataset.o;$app.querySelectorAll("[data-o]").forEach(function(x){x.classList.toggle("sel",x===b);});document.getElementById("lock").disabled=false;};});
    document.getElementById("lock").onclick=function(){st.pick=chosen;state.l2step[t.id]=st;state.l2.push({id:t.id,pick:chosen});save();hud();level2Feedback(t,opts,chosen,head,i);};
    return;
  }
}
function level2Feedback(t,opts,pick,head,i){
  var bestId=TOTOO.best(t.id), got=TOTOO.pts(t.id,pick);
  $app.innerHTML=head+'<div class="result '+(got===5?"good":"bad")+'"><h3>'+(got===5?"Best prompt · +5 points":(got===2?"Close · +2 points":"That was a trap · 0 points"))+'</h3><p>Here is why each prompt works or does not.</p></div>'+
    '<div class="opts">'+opts.map(function(o,k){var p=TOTOO.pts(t.id,o.id), col=p===5?"var(--green)":(p===2?"var(--orange)":"var(--red)");
      var cls=o.id===bestId?"best":(o.id===pick?"miss":"");
      return '<div class="opt '+cls+'"><span class="l">'+"ABCD"[k]+'</span><span>'+esc(o.text)+(o.id===pick?' <b>(your pick)</b>':'')+'<br><span style="color:'+col+';font-weight:700;font-size:14px">'+esc(TOTOO.reason(t.id,o.id))+'</span></span></div>';}).join("")+'</div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn" id="nx">'+(i+1>=P.tasks.length?"Finish Level 2":"Next task")+'</button></div></section>';
  document.getElementById("nx").onclick=level2;
}
function l2Done(){
  var s=TOTOO.score(state);
  $app.innerHTML='<section class="panel center"><span class="label">Level 2 cleared</span><h2>Prompt Lab: '+s.l2+' points</h2><p class="lead">Now group the cards you trusted into themes. This is your literature map.</p><button class="btn orange" id="n">Start Level 3: Map Builder</button></section>';
  document.getElementById("n").onclick=function(){state.level=3;save();route();};
}

/* ---------------- LEVEL 3 ---------------- */
function themeName(id){var t=P.themes.filter(function(x){return x.id===id;})[0];return t?t.name:"";}
function level3(){
  if(state.l3&&state.l3.done) return l3Show();
  var trusted=state.l1.filter(function(a){return a.v==="Real";}).map(function(a){return a.c;});
  var extra=P.extras.map(function(c){return c.id;}).filter(function(id){return trusted.indexOf(id)<0;});
  var d=state.l3draft||{themes:[],assign:{}};
  var menu=TOTOO.seededOrder(P.themes,"themes"+state.team);
  function row(cid,ver){var c=card(cid);return '<div class="arow"><div class="t"><b>'+cid+'</b> '+esc(shortRef(c))+(ver?' <span class="vtag">Verified</span>':'')+'<div class="hint">'+esc(c.claim)+'</div></div><div class="seg" data-c="'+cid+'"></div></div>';}
  $app.innerHTML='<section class="stack"><h2>Level 3: Map Builder</h2>'+
    '<section class="panel"><span class="label">Step 1 · Choose 3 themes</span><p>A good theme groups studies by a <b>shared idea</b>. A weak theme groups them by year, author, or opinion, or is so broad it says nothing. Better themes earn more points (up to 3 each).</p>'+
    '<div class="tgrid">'+menu.map(function(t){return '<button type="button" class="tchip'+(d.themes.indexOf(t.id)>=0?" on":"")+'" data-t="'+t.id+'">'+esc(t.name)+'</button>';}).join("")+'</div><p class="hint" id="tcount"></p></section>'+
    '<section class="panel"><span class="label">Step 2 · Place the studies</span><p class="hint">Tap the theme each study fits. 1 point for each study in a theme it fits (up to 6). A fake or twisted card on your map costs 3 points. You do not have to place every study.</p>'+
    '<div class="assign">'+(trusted.length?'<p class="label" style="margin-top:4px">From your Level 1 verdicts</p>'+trusted.map(function(c){return row(c,false);}).join(""):"")+
    '<p class="label" style="margin-top:10px">Verified by Mission Control (all real)</p>'+extra.map(function(c){return row(c,true);}).join("")+'</div></section>'+
    '<p class="err" id="e3" hidden></p><div class="row" style="justify-content:flex-end"><button class="btn" id="draw">Draw my map</button></div></section>';
  var all=trusted.concat(extra);
  function persist(){state.l3draft=d;save();}
  function paint(){
    document.getElementById("tcount").textContent=d.themes.length+" of 3 chosen"; var e3=document.getElementById("e3"); if(e3) e3.hidden=true;
    $app.querySelectorAll(".tchip").forEach(function(b){b.classList.toggle("on",d.themes.indexOf(b.dataset.t)>=0);});
    $app.querySelectorAll(".seg").forEach(function(seg){var cid=seg.dataset.c, cur=d.assign[cid]==null?-1:d.assign[cid];
      seg.innerHTML=[0,1,2].map(function(k){var nm=d.themes[k]?themeName(d.themes[k]):"Theme "+(k+1);return '<button type="button" class="sb'+(cur===k?" on":"")+'" data-k="'+k+'"'+(d.themes[k]?"":" disabled")+'>'+esc(nm)+'</button>';}).join("")+'<button type="button" class="sb out'+(cur===-1?" on":"")+'" data-k="-1">Leave out</button>';
      seg.querySelectorAll("button").forEach(function(b){b.onclick=function(){d.assign[cid]=parseInt(b.dataset.k,10);persist();paint();};});});
  }
  $app.querySelectorAll(".tchip").forEach(function(b){b.onclick=function(){var id=b.dataset.t, i=d.themes.indexOf(id);
    if(i>=0){d.themes.splice(i,1); Object.keys(d.assign).forEach(function(c){if(d.assign[c]===i)d.assign[c]=-1; else if(d.assign[c]>i)d.assign[c]--;});}
    else if(d.themes.length<3) d.themes.push(id); else {toast("Pick only 3. Tap a chosen theme to remove it.");return;}
    persist();paint();};});
  paint();
  document.getElementById("draw").onclick=function(){
    var e=document.getElementById("e3");
    if(d.themes.length<3){e.textContent="Choose 3 themes first.";e.hidden=false;return;}
    var a={}; all.forEach(function(cid){a[cid]=d.assign[cid]==null?-1:d.assign[cid];});
    if(!Object.keys(a).some(function(c){return a[c]>=0;})){e.textContent="Place at least one study in a theme.";e.hidden=false;return;}
    state.l3={themes:d.themes.slice(),assign:a,done:true}; save(); hud(); l3Show();
  };
}
function l3Show(){
  var s=TOTOO.score(state), th=state.l3.themes;
  var cols=th.map(function(id,k){var info=TOTOO.themeInfo(id), items=Object.keys(state.l3.assign).filter(function(c){return state.l3.assign[c]===k;});
    return '<div class="col"><h3>'+esc(themeName(id))+'</h3><span class="hint" style="color:'+(info.q>=4?"var(--green)":info.q>=3?"var(--orange)":"var(--red)")+'">'+esc(info.fb)+' (+'+info.q+')</span>'+
      (items.length?items.map(function(c){var bad=TOTOO.truth(c)!=="Real", fits=!bad&&info.fit.indexOf(c)>=0;
        return '<span class="chip'+(bad?" badc":"")+'">'+c+' '+esc(shortRef(card(c)))+(bad?(TOTOO.truth(c)==="Fake"?" (fake, -3)":" (summary wrong, -3)"):(fits?' <span class="ok">fits, +1</span>':' <span class="hint">does not fit this theme</span>'))+'</span>';}).join(""):'<span class="hint">No cards</span>')+'</div>';}).join("");
  $app.innerHTML='<section class="stack"><h2>Your literature map</h2><section class="panel"><span class="label">Gender bias in AI algorithms</span><div class="map">'+cols+'</div></section>'+
    '<section class="panel center"><h3>Map Builder: '+s.l3+' points</h3><p class="hint">Themes: +'+s.l3q+' · Studies in the right theme: '+s.l3fit+' (max 6 points). Look across your map. What is missing from every study? That is your gap.</p><button class="btn orange" id="n">Face the Boss: Crack the Gap</button></section></section>';
  document.getElementById("n").onclick=function(){state.level=4;save();route();};
}

/* ---------------- BOSS ---------------- */
function evidenceBoard(){
  if(!state.l3) return "";
  var cols=state.l3.themes.map(function(id,k){var items=Object.keys(state.l3.assign).filter(function(c){return state.l3.assign[c]===k;});
    return '<div class="col"><h3>'+esc(themeName(id))+'</h3>'+(items.length?items.map(function(c){var cd=card(c);return '<div class="evi"><b>'+c+'</b> '+esc(shortRef(cd))+'<div class="hint">'+esc(cd.claim)+'</div></div>';}).join(""):'<span class="hint">No studies</span>')+'</div>';}).join("");
  return '<section class="panel"><span class="label">Evidence board · your map</span><p class="hint">Use these studies in your gap statement. Cite them by card number, like (C03).</p><div class="map">'+cols+'</div></section>';
}
var GAPS=["Empirical","Methodological","Theoretical","Contextual","Population","Contradictory findings","Practical/Policy"];
function boss(){
  var b=state.boss||{};
  $app.innerHTML='<section class="stack"><div class="hero" style="padding-block:4px"><span class="pill" style="color:var(--orange);border-color:#6b4a1d;background:#2a1d0c">Boss Level</span><h1 style="font-size:clamp(30px,6vw,48px)">Crack the Gap</h1><p class="lead">Mission Control scores this level (up to 30 points): does the gap fit your map, is the statement clear, and does the question trace back to your cards?</p></div>'+
   evidenceBoard()+
   '<section class="panel"><div class="field"><label for="gt">Gap type</label><select id="gt"><option value="">Choose one</option>'+GAPS.map(function(g){return '<option'+(b.gap===g?" selected":"")+'>'+g+'</option>';}).join("")+'</select><span class="hint">Look at where and how the studies on your map were done. What is missing from all of them?</span></div>'+
   '<div class="field"><label for="stmt">Gap statement (at least 40 words). Cite cards like this: (C03). End with "Therefore, this study aims to..."</label><textarea id="stmt" style="min-height:150px">'+esc(b.stmt||"")+'</textarea><span class="hint" id="wc"></span></div>'+
   '<div class="field"><label for="rq">Research question</label><input type="text" id="rq" value="'+esc(b.rq||"")+'"></div></section>'+
   '<p class="err" id="eb" hidden></p><div class="row" style="justify-content:center"><button class="btn orange" id="fin">Defeat the Boss and finish</button></div></section>';
  function grab(){return {gap:document.getElementById("gt").value,stmt:document.getElementById("stmt").value,rq:document.getElementById("rq").value};}
  function wc(){var p=document.getElementById("stmt").value, w=TOTOO.words(p), th=/therefore,?\s+this study aims to/i.test(p);
    document.getElementById("wc").innerHTML=w+' words '+(w>=40?'<span class="ok">✓</span>':'(need 40)')+' · "Therefore, this study aims to" '+(th?'<span class="ok">✓</span>':'not found yet');}
  wc(); document.getElementById("stmt").oninput=function(){wc();state.boss=grab();save();};
  ["gt","rq"].forEach(function(k){document.getElementById(k).addEventListener("change",function(){state.boss=grab();save();});});
  document.getElementById("fin").onclick=function(){
    var o=grab(), e=document.getElementById("eb"), fail=null;
    if(!o.gap) fail="Choose a gap type.";
    else if(TOTOO.words(o.stmt)<40) fail="Your gap statement needs at least 40 words.";
    else if(!/therefore,?\s+this study aims to/i.test(o.stmt)) fail='End your statement with "Therefore, this study aims to..."';
    else if(o.rq.trim().length<10) fail="Write your research question.";
    if(fail){e.textContent=fail;e.hidden=false;return;}
    state.boss=o; state.timeLeft=Math.floor(msLeft()/1000); state.finish=now(); state.level=5; save(); if(clockId){clearInterval(clockId);clockId=null;} hud(); report(true);
  };
}

/* ---------------- REPORT ---------------- */
function missionCode(){
  return TOTOO.encode({team:state.team,attempt:state.attempt,start:state.start,finish:state.finish,timeLeft:state.timeLeft||0,timedOut:!!state.timedOut,
    l1:state.l1.map(function(a){return {c:a.c,v:a.v};}), l2:state.l2.map(function(p){return {id:p.id,pick:p.pick};}),
    l3:state.l3?{themes:state.l3.themes,assign:state.l3.assign}:null, boss:state.boss});
}
function reportText(){
  var t=team(state.team), s=TOTOO.score(state), L=[], b=state.boss||{};
  L.push("OPERATION TOTOO · MISSION REPORT","Team "+t.id+": "+t.name+" (Mission "+t.mission+")","Attempt "+state.attempt+" · Finished "+state.finish+(state.timedOut?" (time ran out)":" with "+fmt((state.timeLeft||0)*1000)+" left"),"");
  L.push("SCORE (automatic): "+s.auto+" / 70","  Level 1 Card Drop: "+s.l1+" ("+s.correct+" of "+state.order.length+" correct)","  Level 2 Prompt Lab: "+s.l2,"  Level 3 Map Builder: "+s.l3,"  Lives bonus: "+s.livesBonus+" ("+s.lives+" lives left)","  Time bonus: "+s.timeBonus,"  Boss Level: scored by Mission Control (up to 30)","");
  L.push("LEVEL 1: VERDICTS"); state.l1.forEach(function(a){L.push("  "+a.c+": "+(a.v||"no answer")+" ("+s.cards[a.c]+")");}); L.push("");
  L.push("LEVEL 2: PROMPT LAB"); state.l2.forEach(function(p){var tk=P.tasks.filter(function(x){return x.id===p.id;})[0];L.push("  "+tk.title+": "+TOTOO.pts(p.id,p.pick)+" points");}); L.push("");
  L.push("LEVEL 3: LITERATURE MAP"); if(state.l3) state.l3.themes.forEach(function(id,k){L.push("  "+themeName(id)+": "+Object.keys(state.l3.assign).filter(function(c){return state.l3.assign[c]===k;}).join(", "));}); L.push("");
  L.push("BOSS LEVEL","  Gap type: "+(b.gap||""),"  Gap statement: "+(b.stmt||""),"  Research question: "+(b.rq||""),"");
  L.push("MISSION CODE (send to your instructor)",missionCode());
  return L.join("\n");
}
function report(fresh,timedOut){
  stopTimer(); hud();
  var s=TOTOO.score(state), t=team(state.team), code=missionCode();
  var badge=s.auto>=60?"Source Sleuth":s.auto>=45?"Fact Finder":s.auto>=30?"Rookie Analyst":"Fooled by the Machine";
  $app.innerHTML='<section class="stack"><div class="hero"><span class="pill">'+(timedOut||state.timedOut?"Time is up":(fresh?"Boss defeated":"Mission complete"))+'</span><h1 style="font-size:clamp(30px,6vw,48px)">'+esc(t.name)+'</h1><div class="bigscore">'+s.auto+'<span style="font-size:.35em;color:var(--muted)"> / 70</span></div><p class="sub">'+badge+'</p><p class="lead">Plus up to 30 points from Mission Control for your gap statement.</p></div>'+
   '<div class="break"><div><b>'+s.l1+'</b><span>Card Drop</span></div><div><b>'+s.l2+'</b><span>Prompt Lab</span></div><div><b>'+s.l3+'</b><span>Map Builder</span></div><div><b>'+s.livesBonus+'</b><span>Lives bonus</span></div><div><b>'+s.timeBonus+'</b><span>Time bonus</span></div><div><b style="color:var(--muted)">?</b><span>Boss (pending)</span></div></div>'+
   (state.attempt>1?'<p class="err" style="text-align:center">This is attempt '+state.attempt+' for Team '+t.id+' on this device. Mission Control will see this.</p>':'')+
   '<section class="panel"><span class="label">Step 1 · Send your mission code</span><p>Copy this code and send it to your instructor the way they ask. It holds your answers, so Mission Control can check your score.</p><div class="code" id="mc">'+esc(code)+'</div><div class="row"><button class="btn" id="cpc">Copy mission code</button></div></section>'+
   '<section class="panel"><span class="label">Step 2 · Submit your report</span><p>Copy your full report into a document and upload it to the LMS.</p><div class="row"><button class="btn ghost" id="cpr">Copy full report</button><button class="btn ghost" id="dl">Download report (.txt)</button></div></section>'+
   '<div class="row" style="justify-content:center"><button class="btn ghost" id="home">Back to team select</button></div></section>';
  document.getElementById("cpc").onclick=function(){copy(code);};
  document.getElementById("cpr").onclick=function(){copy(reportText());};
  document.getElementById("dl").onclick=function(){try{var blob=new Blob([reportText()],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Operation-Totoo-Team-"+t.id+".txt";document.body.appendChild(a);a.click();a.remove();}catch(e){toast("Use Copy full report instead");}};
  document.getElementById("home").onclick=home;
}

home();
})();
</script>
</body></html>
